# Configuração de lint e formatação do PEDRO_ARTE_YOUTUBE_LIVING_BOOK_ENGINE.
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific
    "S",    # flake8-bandit (segurança)
    "A",    # flake8-builtins
    "ARG",  # argumentos não utilizados
    "PIE",
    "RET",
]
ignore = [
    "E501",   # comprimento de linha é controlado pelo formatter
    "B008",   # Typer usa chamadas em defaults de argumento por design
    "RUF001", # o projeto é escrito em português: caracteres unicode são esperados
    "RUF002",
    "RUF003",
    "S101",   # assert é permitido (usado em testes e invariantes internas)
]

[lint.per-file-ignores]
"tests/**" = ["S", "ARG", "N806"]
"scripts/**" = ["S", "T201"]
"src/pedroarte_youtube_engine/interfaces/cli/*" = ["ARG"]

[lint.isort]
known-first-party = ["pedroarte_youtube_engine"]

[lint.flake8-tidy-imports.banned-api]
# Regra arquitetural 6.1: o domínio não conhece fornecedores.
"anthropic".msg = "SDKs de fornecedor pertencem a adapters/, nunca ao domínio."
"openai".msg = "SDKs de fornecedor pertencem a adapters/, nunca ao domínio."
"google.generativeai".msg = "SDKs de fornecedor pertencem a adapters/, nunca ao domínio."

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
