[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pedroarte-youtube-engine"
version = "0.1.0"
description = "Motor multiagente que transforma livros em vídeos vivos, séries, trailers, Shorts e mini-novelas para YouTube."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "LicenseRef-Proprietary" }
authors = [{ name = "Pedro Arte", email = "pedroarte2508@gmail.com" }]
keywords = [
    "multi-agent",
    "audiovisual",
    "youtube",
    "book-adaptation",
    "prompt-engineering",
    "rag",
    "mcp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Private :: Do Not Upload",
]
dependencies = [
    "pydantic>=2.7,<3",
    "typer>=0.12",
    "rich>=13.7",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "jsonschema>=4.22",
]

[project.optional-dependencies]
api = ["fastapi>=0.111", "uvicorn[standard]>=0.30"]
parsers = ["pypdf>=4.2", "python-docx>=1.1", "EbookLib>=0.18", "beautifulsoup4>=4.12"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "types-jsonschema>=4.22",
    "httpx>=0.27",
    "pre-commit>=3.7",
]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5"]
all = [
    "pedroarte-youtube-engine[api,parsers,dev,docs]",
]

[project.scripts]
living-video = "pedroarte_youtube_engine.interfaces.cli.main:run"

[project.urls]
Repository = "https://github.com/pedroartelabs/pedroarte-labs-motor-youtube-videos-vivos"

[tool.hatch.build.targets.wheel]
packages = ["src/pedroarte_youtube_engine"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "config", "schemas", "docs", "README.md"]

# A configuração do pytest vive em `pytest.ini` (fonte única de verdade).

[tool.coverage.run]
source = ["src/pedroarte_youtube_engine"]
branch = true
omit = ["*/interfaces/api/*", "*/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
    "@overload",
]
show_missing = true
skip_covered = false
