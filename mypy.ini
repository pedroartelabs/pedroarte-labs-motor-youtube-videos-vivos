[mypy]
python_version = 3.11
files = src/pedroarte_youtube_engine
mypy_path = src
namespace_packages = True
explicit_package_bases = True
plugins = pydantic.mypy

warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = True
no_implicit_optional = True
strict_equality = True
check_untyped_defs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
show_error_codes = True
pretty = True

# O núcleo do domínio é verificado no modo mais rigoroso.
[mypy-pedroarte_youtube_engine.domain.*]
disallow_any_generics = True
disallow_untyped_calls = True
disallow_subclassing_any = True

[mypy-pedroarte_youtube_engine.shared.*]
disallow_any_generics = True

# A camada de interfaces lida com bibliotecas externas com tipagem parcial.
[mypy-pedroarte_youtube_engine.interfaces.*]
warn_return_any = False

[mypy-pedroarte_youtube_engine.mcp.*]
warn_return_any = False

# Dependências opcionais sem stubs publicados.
[mypy-docx.*]
ignore_missing_imports = True

[mypy-pypdf.*]
ignore_missing_imports = True

[mypy-ebooklib.*]
ignore_missing_imports = True

[mypy-bs4.*]
ignore_missing_imports = True

[mypy-fastapi.*]
ignore_missing_imports = True

[mypy-uvicorn.*]
ignore_missing_imports = True

[pydantic-mypy]
init_forbid_extra = True
init_typed = True
warn_required_dynamic_aliases = True
