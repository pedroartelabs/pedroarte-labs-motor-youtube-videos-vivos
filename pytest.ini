[pytest]
minversion = 8.0
testpaths = tests
addopts = -ra --strict-markers --strict-config
markers =
    unit: testes unitários puros de domínio
    property: testes baseados em propriedades (Hypothesis)
    integration: testes que exercitam o pipeline completo
    contract: testes de contrato de portas e adaptadores
    golden: testes de regressão contra artefatos versionados
    slow: testes demorados
filterwarnings =
    error::DeprecationWarning:pedroarte_youtube_engine.*
